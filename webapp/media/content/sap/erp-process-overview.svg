<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">End-to-End 프로세스</title><desc id="desc">5단계 흐름. 01 기준정보와 원가 준비, 02 생산계획과 MRP, 03 구매, 자재, 생산, 04 판매와 출하, 05 원가, 결산, 분석 순서로 앞 단계의 데이터가 다음 단계의 입력이 됩니다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#4f74b8" stroke-width="1.5"/></marker></defs><rect width="1200" height="700" fill="#f8fafc"/><g font-family="Pretendard, sans-serif"><text x="40" y="57" font-size="32" fill="#1a2128" font-weight="800">End-to-End 프로세스</text><text x="40" y="101" font-size="21" fill="#4c5967" font-weight="400">한 번의 업무 흐름으로 이어지는 구매, 생산, 출하, 재무</text><rect x="40" y="150" width="350" height="230" rx="12" fill="#fff" stroke="#e2e5e9"/><text x="60" y="183" font-size="18" fill="#4f74b8" font-weight="700">STEP 01 / CO, MM</text><text x="60" y="227" font-size="24" fill="#1a2128" font-weight="800">기준정보, 원가 사전 세팅</text><text x="60" y="295" font-size="16" fill="#4c5967" font-weight="400">원자재 예측단가, 계획 임률, 표준원가,</text><text x="60" y="319" font-size="16" fill="#4c5967" font-weight="400">안전재고와 재주문점 설정</text><rect x="425" y="150" width="350" height="230" rx="12" fill="#fff" stroke="#e2e5e9"/><text x="445" y="183" font-size="18" fill="#4f74b8" font-weight="700">STEP 02 / PP, MM</text><text x="445" y="227" font-size="24" fill="#1a2128" font-weight="800">생산계획 안정화</text><text x="445" y="295" font-size="16" fill="#4c5967" font-weight="400">생산계획, MRP, PR 자동 생성</text><rect x="810" y="150" width="350" height="230" rx="12" fill="#fff" stroke="#e2e5e9"/><text x="830" y="183" font-size="18" fill="#4f74b8" font-weight="700">STEP 03 / MM, PP, FI 연계</text><text x="830" y="227" font-size="24" fill="#1a2128" font-weight="800">구매, 입고, 생산출고,</text><text x="830" y="259" font-size="24" fill="#1a2128" font-weight="800">재고추적</text><text x="830" y="295" font-size="16" fill="#4c5967" font-weight="400">PR, PO, 입고, 원자재 출고, 배치, QR,</text><text x="830" y="319" font-size="16" fill="#4c5967" font-weight="400">재고 분석</text><rect x="235" y="435" width="350" height="230" rx="12" fill="#fff" stroke="#e2e5e9"/><text x="255" y="468" font-size="18" fill="#4f74b8" font-weight="700">STEP 04 / SD, MM, FI, CO 연계</text><text x="255" y="512" font-size="24" fill="#1a2128" font-weight="800">판매, 출하, 재무 연계</text><text x="255" y="580" font-size="16" fill="#4c5967" font-weight="400">모바일 카탈로그, 주문 변경, 출하 지시,</text><text x="255" y="604" font-size="16" fill="#4c5967" font-weight="400">PGI, 전표 조회</text><rect x="620" y="435" width="350" height="230" rx="12" fill="#edf1f9" stroke="#4f74b8"/><text x="640" y="468" font-size="18" fill="#4f74b8" font-weight="700">STEP 05 / CO, FI, Fiori</text><text x="640" y="512" font-size="24" fill="#1a2128" font-weight="800">결산, 원가, 수익성,</text><text x="640" y="544" font-size="24" fill="#1a2128" font-weight="800">경영관리</text><text x="640" y="580" font-size="16" fill="#4c5967" font-weight="400">간접비 전표, 제조간접비 배부, 실제</text><text x="640" y="604" font-size="16" fill="#4c5967" font-weight="400">가공비, 실제원가, 월말결산, 수익성</text><text x="640" y="628" font-size="16" fill="#4c5967" font-weight="400">분석, KPI</text><g stroke="#4f74b8" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M394 265H417"/><path d="M779 265H802"/><path d="M985 385V408H410V427"/><path d="M589 550H612"/></g></g></svg>